<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contacto y consultas - Distribuidora Gas El Volcán Chillán.">
  <title>Gas El Volcán | Contacto</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="sticky-top shadow-sm">
    <nav class="navbar navbar-expand-lg navbar-custom py-2">
      <div class="container">
        <a class="navbar-brand brand-volcan fs-4" href="index.html">
          <i class="bi bi-fire text-danger me-1"></i>Gas <span>El Volcán</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarMain">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0 fw-semibold">
            <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="productos.html">Cilindros de Gas</a></li>
            <li class="nav-item"><a class="nav-link" href="registro.html">Ingreso / Registro</a></li>
            <li class="nav-item"><a class="nav-link active text-danger" href="contacto.html">Contacto</a></li>
          </ul>
          <div class="d-flex">
            <a href="carrito.html" class="btn btn-outline-danger fw-bold position-relative">
              <i class="bi bi-cart3 me-1"></i> Mis Pedidos
              <span class="badge bg-danger rounded-pill cart-count ms-1">0</span>
            </a>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <main class="py-5 bg-light">
    <div class="container" style="max-width: 650px;">
      <div class="card shadow-sm border-0 rounded-4 p-4">
        <h1 class="h3 fw-bold mb-2">Contacto y Atención al Cliente</h1>
        <p class="text-muted small mb-4">¿Dudas con tu reparto o convenio comercial? Escríbenos directamente</p>

        <div class="alert alert-success d-none" id="mensajeExitoContacto" role="alert"></div>

        <form id="formContacto" novalidate>
          <div class="mb-3">
            <label for="contactoNombre" class="form-label fw-semibold">Nombre Completo *</label>
            <input type="text" id="contactoNombre" class="form-control" placeholder="Tu nombre completo">
            <div class="invalid-feedback" id="error-contactoNombre"></div>
          </div>

          <div class="mb-3">
            <label for="contactoEmail" class="form-label fw-semibold">Correo Electrónico *</label>
            <input type="email" id="contactoEmail" class="form-control" placeholder="usuario@correo.com">
            <div class="invalid-feedback" id="error-contactoEmail"></div>
          </div>

          <div class="mb-3">
            <label for="contactoAsunto" class="form-label fw-semibold">Asunto *</label>
            <input type="text" id="contactoAsunto" class="form-control" placeholder="Ej: Consulta sobre zonas de reparto en Pinto">
            <div class="invalid-feedback" id="error-contactoAsunto"></div>
          </div>

          <div class="mb-4">
            <label for="contactoMensaje" class="form-label fw-semibold">Mensaje o Consulta *</label>
            <textarea id="contactoMensaje" class="form-control" rows="4" placeholder="Escribe aquí tu consulta..."></textarea>
            <div class="invalid-feedback" id="error-contactoMensaje"></div>
          </div>

          <button type="submit" class="btn btn-danger w-100 py-2 fw-bold">Enviar Mensaje a Operadora</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="footer-custom py-4 mt-auto">
    <div class="container text-center">
      <small class="text-secondary">&copy; 2026 Proyecto DSY1104 - Gas El Volcán Chillán</small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/validaciones.js"></script>
</body>
</html>
