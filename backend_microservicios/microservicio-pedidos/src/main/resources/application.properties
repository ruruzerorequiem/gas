server.port=8083

# Base de datos independiente para Pedidos y Logística (Laragon MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/gas_pedidos_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=20000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Misma clave para los 3 microservicios
jwt.secret=ClaveSecretaSuperSeguraParaDistribuidoraGasElVolcanChillan2026

# URL del microservicio de productos para comunicación REST interna
productos.service.url=http://localhost:8082

# Swagger (OpenAPI)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html