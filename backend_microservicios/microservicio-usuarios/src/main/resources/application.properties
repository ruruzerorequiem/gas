server.port=8081

# Conexión a MySQL en Laragon
spring.datasource.url=jdbc:mysql://localhost:3306/gas_usuarios_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de Conexiones (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=20000

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuración JWT
jwt.secret=ClaveSecretaSuperSeguraParaDistribuidoraGasElVolcanChillan2026
jwt.expiration=86400000

# Swagger (OpenAPI)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html