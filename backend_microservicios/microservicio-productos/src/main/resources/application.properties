server.port=8082

# Base de datos independiente para Catálogo y Stock (Laragon MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/gas_productos_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=20000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Misma clave secreta que microservicio-usuarios (puerto 8081)
jwt.secret=ClaveSecretaSuperSeguraParaDistribuidoraGasElVolcanChillan2026

# Swagger (OpenAPI)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html