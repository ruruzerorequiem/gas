server {
    listen 80;
    server_name _;

    root /var/www/gas/gas-react/dist;
    index index.html;

    # Proxy a Microservicio Usuarios (8081)
    location /api/auth/ {
        proxy_pass http://127.0.0.1:8081/api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/usuarios {
        proxy_pass http://127.0.0.1:8081/api/usuarios;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/usuarios/ {
        proxy_pass http://127.0.0.1:8081/api/usuarios/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy a Microservicio Productos (8082)
    location /api/productos {
        proxy_pass http://127.0.0.1:8082/api/productos;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/productos/ {
        proxy_pass http://127.0.0.1:8082/api/productos/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy a Microservicio Pedidos (8083)
    location /api/pedidos {
        proxy_pass http://127.0.0.1:8083/api/pedidos;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/pedidos/ {
        proxy_pass http://127.0.0.1:8083/api/pedidos/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Frontend SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
