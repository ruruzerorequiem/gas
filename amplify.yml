version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd gas-react
        - npm install
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: gas-react/dist
    files:
      - '**/*'
  cache:
    paths:
      - gas-react/node_modules/**/*
  # Cabeceras básicas de seguridad web para proteger la aplicación desplegada
  customHeaders:
    - pattern: '**/*'
      headers:
        - key: 'X-Frame-Options'
          value: 'DENY'
        - key: 'X-Content-Type-Options'
          value: 'nosniff'
        - key: 'Referrer-Policy'
          value: 'strict-origin-when-cross-origin'
